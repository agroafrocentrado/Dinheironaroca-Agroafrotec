<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3B2F">
<title>Meu Dinheiro na Roça</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg: #F7F2E4;
    --bg-card: #FFFFFF;
    --ink: #2A2118;
    --ink-soft: #6B5F4F;
    --verde: #3C6E42;
    --verde-escuro: #26492B;
    --terra: #A8482E;
    --terra-escuro: #7E3320;
    --ouro: #C99A2E;
    --linha: #E7DCC4;
    --radius: 18px;
    --fs: 18px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:var(--fs);
    line-height:1.4;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;}
  .app{max-width:480px;margin:0 auto;padding:16px 16px 90px;}

  /* Cabeçalho */
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px;}
  .propriedade{font-weight:800;font-size:1.15em;letter-spacing:-0.01em;border:none;background:none;color:var(--verde-escuro);width:100%;padding:0;}
  .propriedade:focus{outline:2px solid var(--ouro);border-radius:6px;}
  .ajustes-fonte{display:flex;gap:6px;flex-shrink:0;}
  .ajustes-fonte button{
    width:34px;height:34px;border-radius:10px;border:1.5px solid var(--linha);
    background:var(--bg-card);font-weight:700;color:var(--ink-soft);
  }

  /* Card de saldo */
  .saldo-card{
    background:var(--verde-escuro);
    color:#F5EFDD;
    border-radius:var(--radius);
    padding:22px 20px;
    margin-bottom:18px;
  }
  .saldo-label{font-size:0.85em;opacity:0.85;margin-bottom:4px;}
  .saldo-valor{font-size:2.1em;font-weight:800;letter-spacing:-0.02em;}
  .saldo-sub{font-size:0.8em;opacity:0.75;margin-top:6px;}

  /* Botões grandes de ação */
  .acoes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
  .btn-acao{
    border:none;border-radius:var(--radius);
    padding:22px 10px;
    font-size:1.05em;font-weight:700;
    color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    min-height:96px;
  }
  .btn-acao:active{transform:scale(0.97);}
  .btn-entrada{background:var(--verde);}
  .btn-saida{background:var(--terra);}
  .btn-acao .icone{font-size:1.8em;}

  /* Links secundários */
  .secundarios{display:flex;flex-direction:column;gap:10px;}
  .btn-secundario{
    background:var(--bg-card);
    border:1.5px solid var(--linha);
    border-radius:14px;
    padding:16px;
    font-size:1em;font-weight:600;
    color:var(--ink);
    display:flex;align-items:center;justify-content:space-between;
  }
  .btn-secundario .seta{color:var(--ink-soft);}

  /* Overlay / telas cheias */
  .tela{
    position:fixed;inset:0;background:var(--bg);
    display:none;flex-direction:column;
    z-index:20;
  }
  .tela.ativa{display:flex;}
  .tela-topo{
    display:flex;align-items:center;gap:12px;
    padding:16px;padding-top:calc(16px + env(safe-area-inset-top));
    border-bottom:1px solid var(--linha);
    background:var(--bg-card);
  }
  .fechar{
    width:40px;height:40px;border-radius:12px;border:none;background:var(--linha);
    font-size:1.3em;color:var(--ink);flex-shrink:0;
  }
  .tela-titulo{font-weight:800;font-size:1.1em;}
  .tela-corpo{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));}

  /* Chips de categoria */
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .chip{
    border:2px solid var(--linha);
    background:var(--bg-card);
    border-radius:14px;
    padding:16px 8px;
    text-align:center;
    font-weight:600;
    font-size:0.95em;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    min-height:76px;
    color:var(--ink);
  }
  .chip .icone{font-size:1.5em;}
  .chip.selecionado{border-color:var(--sel-cor, var(--verde));background:var(--sel-bg, #EAF3EA);}
  .chip-wrap{position:relative;}
  .chip-wrap .chip{width:100%;}
  .chip-remover{
    position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;
    border:none;background:var(--linha);color:var(--ink-soft);font-size:0.8em;line-height:1;
    display:flex;align-items:center;justify-content:center;z-index:2;
  }
  .chip-add{
    border:2px dashed var(--linha);background:transparent;color:var(--ink-soft);
  }
  .chip-add .icone{font-size:1.5em;}

  .form-categoria{
    background:var(--bg-card);border:1.5px solid var(--linha);border-radius:14px;
    padding:16px;margin-bottom:20px;display:none;
  }
  .form-categoria.aberto{display:block;}
  .form-categoria-linha{display:flex;gap:8px;margin-bottom:12px;}
  .campo-emoji{
    width:64px;flex-shrink:0;text-align:center;font-size:1.4em;
    border:1.5px solid var(--linha);border-radius:12px;padding:12px 4px;background:var(--bg);color:var(--ink);
  }
  .campo-nome-categoria{
    flex:1;border:1.5px solid var(--linha);border-radius:12px;padding:12px;font-size:0.95em;
    background:var(--bg);color:var(--ink);
  }
  .form-categoria-botoes{display:flex;gap:8px;}
  .form-categoria-botoes button{
    flex:1;border:none;border-radius:12px;padding:12px;font-weight:700;font-size:0.92em;
  }
  .btn-add-categoria{background:var(--verde-escuro);color:#fff;}
  .btn-add-categoria:disabled{background:#C9C1AE;color:#8A8270;}
  .btn-cancelar-categoria{background:var(--linha);color:var(--ink);}

  /* Valor + teclado próprio */
  .valor-caixa{
    background:var(--bg-card);
    border-radius:16px;
    padding:18px;
    text-align:center;
    margin-bottom:14px;
    border:1.5px solid var(--linha);
  }
  .valor-label{font-size:0.8em;color:var(--ink-soft);margin-bottom:4px;}
  .valor-numero{font-size:2.2em;font-weight:800;letter-spacing:-0.02em;}
  .teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .tecla{
    background:var(--bg-card);border:1.5px solid var(--linha);border-radius:12px;
    padding:16px 0;font-size:1.3em;font-weight:700;color:var(--ink);
  }
  .tecla:active{background:var(--linha);}
  .tecla.apagar{font-size:1.1em;color:var(--terra-escuro);}

  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:0.85em;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .campo-com-mic{display:flex;gap:8px;}
  .campo-com-mic input{
    flex:1;border:1.5px solid var(--linha);border-radius:12px;padding:14px;font-size:1em;
    background:var(--bg-card);color:var(--ink);
  }
  .btn-mic{
    width:52px;flex-shrink:0;border-radius:12px;border:1.5px solid var(--linha);
    background:var(--bg-card);font-size:1.3em;
  }
  .btn-mic.gravando{background:var(--terra);color:#fff;border-color:var(--terra);}

  .btn-salvar{
    width:100%;border:none;border-radius:16px;padding:18px;
    font-size:1.1em;font-weight:800;color:#fff;background:var(--verde-escuro);
    margin-top:6px;
  }
  .btn-salvar:disabled{background:#C9C1AE;color:#8A8270;}

  /* Histórico */
  .filtro-periodo{display:flex;gap:8px;margin-bottom:16px;}
  .filtro-periodo button{
    flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--linha);
    background:var(--bg-card);font-weight:600;font-size:0.85em;color:var(--ink-soft);
  }
  .filtro-periodo button.ativo{background:var(--verde-escuro);color:#fff;border-color:var(--verde-escuro);}

  .resumo-mini{display:flex;gap:10px;margin-bottom:18px;}
  .resumo-mini .cartao{
    flex:1;background:var(--bg-card);border:1.5px solid var(--linha);border-radius:14px;padding:12px;
  }
  .resumo-mini .rotulo{font-size:0.75em;color:var(--ink-soft);}
  .resumo-mini .num{font-size:1.15em;font-weight:800;}
  .resumo-mini .num.pos{color:var(--verde-escuro);}
  .resumo-mini .num.neg{color:var(--terra-escuro);}

  .dia-grupo{margin-bottom:18px;}
  .dia-titulo{font-size:0.85em;font-weight:700;color:var(--ink-soft);margin-bottom:8px;}
  .item{
    display:flex;align-items:center;gap:12px;background:var(--bg-card);
    border:1.5px solid var(--linha);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .item .icone{font-size:1.4em;width:34px;text-align:center;}
  .item .info{flex:1;min-width:0;}
  .item .cat{font-weight:700;font-size:0.95em;}
  .item .obs{font-size:0.82em;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .val{font-weight:800;font-size:1em;flex-shrink:0;}
  .item .val.pos{color:var(--verde-escuro);}
  .item .val.neg{color:var(--terra-escuro);}
  .item .excluir{background:none;border:none;color:var(--ink-soft);font-size:1.2em;padding:4px 6px;flex-shrink:0;}

  .vazio{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .vazio .icone{font-size:2.6em;margin-bottom:10px;}

  /* Resumo / WhatsApp */
  .caixa-texto{
    background:var(--bg-card);border:1.5px solid var(--linha);border-radius:14px;
    padding:16px;white-space:pre-wrap;font-size:0.92em;line-height:1.6;margin-bottom:18px;
    max-height:40vh;overflow-y:auto;
  }
  .btn-whatsapp{
    width:100%;border:none;border-radius:16px;padding:18px;
    font-size:1.05em;font-weight:800;color:#fff;background:#2E7D32;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }

  .aviso-offline{
    display:none;
    background:var(--ouro);color:#3A2C05;font-weight:700;font-size:0.82em;
    text-align:center;padding:8px;border-radius:10px;margin-bottom:14px;
  }
  .aviso-offline.mostrar{display:block;}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    background:var(--verde-escuro);color:#fff;padding:12px 20px;border-radius:30px;
    font-weight:700;font-size:0.9em;z-index:40;opacity:0;pointer-events:none;
    transition:opacity .25s;
  }
  .toast.mostrar{opacity:1;}

  @media (min-width:600px){ .app{padding-top:32px;} }
</style>
</head>
<body>

<div class="app">
  <header>
    <input class="propriedade" id="nomePropriedade" value="Minha Propriedade" aria-label="Nome da propriedade">
    <div class="ajustes-fonte">
      <button id="fonteMenos" aria-label="Diminuir letra">A-</button>
      <button id="fonteMais" aria-label="Aumentar letra">A+</button>
    </div>
  </header>

  <div class="aviso-offline" id="avisoOffline">Sem internet agora — pode continuar anotando normalmente. O envio por WhatsApp funciona quando a conexão voltar.</div>

  <div class="saldo-card">
    <div class="saldo-label">Saldo em caixa</div>
    <div class="saldo-valor" id="saldoTotal">R$ 0,00</div>
    <div class="saldo-sub" id="saldoSub">Nenhum lançamento ainda</div>
  </div>

  <div class="acoes">
    <button class="btn-acao btn-entrada" onclick="abrirLancamento('entrada')">
      <span class="icone">💰</span> Entrou dinheiro
    </button>
    <button class="btn-acao btn-saida" onclick="abrirLancamento('saida')">
      <span class="icone">💸</span> Saiu dinheiro
    </button>
  </div>

  <div class="secundarios">
    <button class="btn-secundario" onclick="abrirHistorico()">
      <span>📋 Ver histórico</span><span class="seta">›</span>
    </button>
    <button class="btn-secundario" onclick="abrirResumo()">
      <span>📤 Enviar resumo por WhatsApp</span><span class="seta">›</span>
    </button>
  </div>
</div>

<!-- TELA: LANÇAMENTO -->
<div class="tela" id="telaLancamento">
  <div class="tela-topo">
    <button class="fechar" onclick="fecharTela('telaLancamento')" aria-label="Fechar">✕</button>
    <div class="tela-titulo" id="tituloLancamento">Entrou dinheiro</div>
  </div>
  <div class="tela-corpo">
    <div class="chips" id="chipsCategoria"></div>

    <div class="form-categoria" id="formCategoria">
      <div class="form-categoria-linha">
        <input class="campo-emoji" id="novoEmoji" maxlength="4" placeholder="😀" aria-label="Emoji da categoria">
        <input class="campo-nome-categoria" id="novoNomeCategoria" placeholder="Nome da categoria" aria-label="Nome da nova categoria">
      </div>
      <div class="form-categoria-botoes">
        <button class="btn-cancelar-categoria" onclick="fecharFormCategoria()">Cancelar</button>
        <button class="btn-add-categoria" id="btnAddCategoria" onclick="adicionarCategoria()" disabled>Adicionar</button>
      </div>
    </div>

    <div class="valor-caixa">
      <div class="valor-label">Valor</div>
      <div class="valor-numero" id="valorNumero">R$ 0,00</div>
    </div>
    <div class="teclado">
      <button class="tecla" onclick="digitar('1')">1</button>
      <button class="tecla" onclick="digitar('2')">2</button>
      <button class="tecla" onclick="digitar('3')">3</button>
      <button class="tecla" onclick="digitar('4')">4</button>
      <button class="tecla" onclick="digitar('5')">5</button>
      <button class="tecla" onclick="digitar('6')">6</button>
      <button class="tecla" onclick="digitar('7')">7</button>
      <button class="tecla" onclick="digitar('8')">8</button>
      <button class="tecla" onclick="digitar('9')">9</button>
      <button class="tecla" onclick="digitar('00')">00</button>
      <button class="tecla" onclick="digitar('0')">0</button>
      <button class="tecla apagar" onclick="apagar()">⌫</button>
    </div>

    <div class="campo">
      <label for="obsLancamento">O que foi (opcional)</label>
      <div class="campo-com-mic">
        <input type="text" id="obsLancamento" placeholder="Ex: adubo pra bananeira">
        <button class="btn-mic" id="btnMic" onclick="alternarMicrofone()" aria-label="Falar em vez de digitar">🎤</button>
      </div>
    </div>

    <button class="btn-salvar" id="btnSalvarLancamento" onclick="salvarLancamento()" disabled>Salvar lançamento</button>
  </div>
</div>

<!-- TELA: HISTÓRICO -->
<div class="tela" id="telaHistorico">
  <div class="tela-topo">
    <button class="fechar" onclick="fecharTela('telaHistorico')" aria-label="Fechar">✕</button>
    <div class="tela-titulo">Histórico</div>
  </div>
  <div class="tela-corpo">
    <div class="filtro-periodo">
      <button class="ativo" data-periodo="7" onclick="filtrarHistorico('7', this)">7 dias</button>
      <button data-periodo="30" onclick="filtrarHistorico('30', this)">Este mês</button>
      <button data-periodo="tudo" onclick="filtrarHistorico('tudo', this)">Tudo</button>
    </div>
    <div class="resumo-mini">
      <div class="cartao"><div class="rotulo">Entrou</div><div class="num pos" id="miniEntrou">R$ 0,00</div></div>
      <div class="cartao"><div class="rotulo">Saiu</div><div class="num neg" id="miniSaiu">R$ 0,00</div></div>
    </div>
    <div id="listaHistorico"></div>
  </div>
</div>

<!-- TELA: RESUMO WHATSAPP -->
<div class="tela" id="telaResumo">
  <div class="tela-topo">
    <button class="fechar" onclick="fecharTela('telaResumo')" aria-label="Fechar">✕</button>
    <div class="tela-titulo">Enviar resumo</div>
  </div>
  <div class="tela-corpo">
    <div class="filtro-periodo">
      <button class="ativo" data-periodo="7" onclick="montarResumo('7', this)">7 dias</button>
      <button data-periodo="30" onclick="montarResumo('30', this)">Este mês</button>
      <button data-periodo="tudo" onclick="montarResumo('tudo', this)">Tudo</button>
    </div>
    <div class="caixa-texto" id="textoResumo"></div>
    <button class="btn-whatsapp" onclick="enviarWhatsapp()">📲 Abrir no WhatsApp</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Estado ---------- */
const CHAVE_DADOS = 'cfr_lancamentos_v1';
const CHAVE_NOME = 'cfr_propriedade_v1';
const CHAVE_FONTE = 'cfr_fonte_v1';
const CHAVE_CAT_CUSTOM = 'cfr_categorias_custom_v1';

const CATEGORIAS = {
  entrada: [
    {id:'venda', icone:'🌾', rotulo:'Venda de produto'},
    {id:'colheita', icone:'🧺', rotulo:'Colheita entregue'},
    {id:'servico', icone:'🤝', rotulo:'Diária / serviço prestado'},
    {id:'outro_entrada', icone:'➕', rotulo:'Outro'},
  ],
  saida: [
    {id:'insumo', icone:'🌱', rotulo:'Insumo (adubo, semente...)'},
    {id:'mao_obra', icone:'👷', rotulo:'Mão de obra'},
    {id:'transporte', icone:'🚚', rotulo:'Transporte / frete'},
    {id:'combustivel', icone:'⛽', rotulo:'Combustível'},
    {id:'manutencao', icone:'🔧', rotulo:'Manutenção / equipamento'},
    {id:'outro_saida', icone:'➖', rotulo:'Outro'},
  ]
};

let tipoAtual = 'entrada';
let categoriaAtual = null;
let valorCentavos = 0;
let reconhecimento = null;
let gravandoVoz = false;

function carregar(){
  try{ return JSON.parse(localStorage.getItem(CHAVE_DADOS)) || []; }
  catch(e){ return []; }
}
function salvar(lista){
  try{ localStorage.setItem(CHAVE_DADOS, JSON.stringify(lista)); return true; }
  catch(e){ mostrarToast('Não consegui salvar neste aparelho'); return false; }
}

/* ---------- Categorias personalizadas ---------- */
function carregarCategoriasCustom(){
  try{
    return JSON.parse(localStorage.getItem(CHAVE_CAT_CUSTOM)) || {entrada:[], saida:[]};
  }catch(e){
    return {entrada:[], saida:[]};
  }
}
function salvarCategoriasCustom(dados){
  try{ localStorage.setItem(CHAVE_CAT_CUSTOM, JSON.stringify(dados)); return true; }
  catch(e){ mostrarToast('Não consegui salvar a categoria neste aparelho'); return false; }
}
function obterCategorias(tipo){
  const custom = carregarCategoriasCustom();
  return CATEGORIAS[tipo].concat((custom[tipo] || []).map(c => Object.assign({custom:true}, c)));
}

function formatarMoeda(centavos){
  return (centavos/100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

/* ---------- Inicialização ---------- */
window.addEventListener('DOMContentLoaded', () => {
  const nomeSalvo = localStorage.getItem(CHAVE_NOME);
  if(nomeSalvo) document.getElementById('nomePropriedade').value = nomeSalvo;
  document.getElementById('nomePropriedade').addEventListener('change', e=>{
    localStorage.setItem(CHAVE_NOME, e.target.value);
  });

  const fonteSalva = localStorage.getItem(CHAVE_FONTE);
  if(fonteSalva) document.documentElement.style.setProperty('--fs', fonteSalva);
  document.getElementById('fonteMais').addEventListener('click', ()=>ajustarFonte(1));
  document.getElementById('fonteMenos').addEventListener('click', ()=>ajustarFonte(-1));

  atualizarSaldo();
  configurarVoz();

  window.addEventListener('online', atualizarAvisoConexao);
  window.addEventListener('offline', atualizarAvisoConexao);
  atualizarAvisoConexao();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  document.getElementById('novoEmoji').addEventListener('input', validarFormCategoria);
  document.getElementById('novoNomeCategoria').addEventListener('input', validarFormCategoria);
});

function atualizarAvisoConexao(){
  document.getElementById('avisoOffline').classList.toggle('mostrar', !navigator.onLine);
}

function ajustarFonte(direcao){
  const atual = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 18;
  const novo = Math.min(24, Math.max(15, atual + direcao*1.5));
  document.documentElement.style.setProperty('--fs', novo+'px');
  localStorage.setItem(CHAVE_FONTE, novo+'px');
}

/* ---------- Saldo ---------- */
function atualizarSaldo(){
  const lista = carregar();
  let saldo = 0;
  lista.forEach(l => saldo += (l.tipo === 'entrada' ? l.valor : -l.valor));
  document.getElementById('saldoTotal').textContent = formatarMoeda(saldo);
  document.getElementById('saldoSub').textContent = lista.length
    ? lista.length + (lista.length === 1 ? ' lançamento registrado' : ' lançamentos registrados')
    : 'Nenhum lançamento ainda';
}

/* ---------- Tela de lançamento ---------- */
function abrirLancamento(tipo){
  tipoAtual = tipo;
  categoriaAtual = null;
  valorCentavos = 0;
  document.getElementById('obsLancamento').value = '';
  document.getElementById('valorNumero').textContent = 'R$ 0,00';
  document.getElementById('tituloLancamento').textContent = tipo === 'entrada' ? 'Entrou dinheiro' : 'Saiu dinheiro';

  fecharFormCategoria();
  renderizarChips();
  validarSalvar();
  abrirTela('telaLancamento');
}

function renderizarChips(){
  const cor = tipoAtual === 'entrada' ? 'var(--verde)' : 'var(--terra)';
  const bg = tipoAtual === 'entrada' ? '#EAF3EA' : '#F7E9E4';
  const wrap = document.getElementById('chipsCategoria');
  wrap.innerHTML = '';

  obterCategorias(tipoAtual).forEach(cat => {
    const envolt = document.createElement('div');
    envolt.className = 'chip-wrap';

    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.style.setProperty('--sel-cor', cor);
    btn.style.setProperty('--sel-bg', bg);
    if(categoriaAtual && categoriaAtual.id === cat.id) btn.classList.add('selecionado');
    btn.innerHTML = `<span class="icone">${cat.icone}</span><span>${cat.rotulo}</span>`;
    btn.onclick = () => selecionarCategoria(cat, btn);
    envolt.appendChild(btn);

    if(cat.custom){
      const remover = document.createElement('button');
      remover.className = 'chip-remover';
      remover.setAttribute('aria-label', 'Remover categoria');
      remover.textContent = '✕';
      remover.onclick = (evento) => { evento.stopPropagation(); removerCategoriaCustom(cat.id); };
      envolt.appendChild(remover);
    }

    wrap.appendChild(envolt);
  });

  const envoltAdd = document.createElement('div');
  envoltAdd.className = 'chip-wrap';
  const btnAdd = document.createElement('button');
  btnAdd.className = 'chip chip-add';
  btnAdd.innerHTML = `<span class="icone">➕</span><span>Nova categoria</span>`;
  btnAdd.onclick = () => abrirFormCategoria();
  envoltAdd.appendChild(btnAdd);
  wrap.appendChild(envoltAdd);
}

function selecionarCategoria(cat, elemento){
  categoriaAtual = cat;
  document.querySelectorAll('#chipsCategoria .chip').forEach(c => c.classList.remove('selecionado'));
  elemento.classList.add('selecionado');
  validarSalvar();
}

function abrirFormCategoria(){
  document.getElementById('formCategoria').classList.add('aberto');
  document.getElementById('novoEmoji').value = '';
  document.getElementById('novoNomeCategoria').value = '';
  validarFormCategoria();
  document.getElementById('novoEmoji').focus();
}
function fecharFormCategoria(){
  document.getElementById('formCategoria').classList.remove('aberto');
}
function validarFormCategoria(){
  const emoji = document.getElementById('novoEmoji').value.trim();
  const nome = document.getElementById('novoNomeCategoria').value.trim();
  document.getElementById('btnAddCategoria').disabled = !(emoji && nome);
}
function adicionarCategoria(){
  const emoji = document.getElementById('novoEmoji').value.trim();
  const nome = document.getElementById('novoNomeCategoria').value.trim();
  if(!emoji || !nome) return;

  const custom = carregarCategoriasCustom();
  const novaCategoria = {
    id: 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    icone: emoji,
    rotulo: nome
  };
  custom[tipoAtual] = custom[tipoAtual] || [];
  custom[tipoAtual].push(novaCategoria);
  if(!salvarCategoriasCustom(custom)) return;

  fecharFormCategoria();
  renderizarChips();
  const chipCriado = Array.from(document.querySelectorAll('#chipsCategoria .chip')).find(c => c.textContent.includes(nome));
  if(chipCriado) selecionarCategoria(Object.assign({custom:true}, novaCategoria), chipCriado);
  mostrarToast('Categoria criada ✓');
}
function removerCategoriaCustom(id){
  if(!confirm('Remover esta categoria?')) return;
  const custom = carregarCategoriasCustom();
  custom[tipoAtual] = (custom[tipoAtual] || []).filter(c => c.id !== id);
  salvarCategoriasCustom(custom);
  if(categoriaAtual && categoriaAtual.id === id) categoriaAtual = null;
  renderizarChips();
  validarSalvar();
}

function digitar(n){
  const texto = String(valorCentavos) + n;
  valorCentavos = parseInt(texto, 10);
  if(valorCentavos > 99999999) valorCentavos = 99999999;
  document.getElementById('valorNumero').textContent = formatarMoeda(valorCentavos);
  validarSalvar();
}
function apagar(){
  valorCentavos = Math.floor(valorCentavos / 10);
  document.getElementById('valorNumero').textContent = formatarMoeda(valorCentavos);
  validarSalvar();
}

function validarSalvar(){
  document.getElementById('btnSalvarLancamento').disabled = !(categoriaAtual && valorCentavos > 0);
}

function salvarLancamento(){
  const lista = carregar();
  lista.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    tipo: tipoAtual,
    categoria: categoriaAtual ? categoriaAtual.id : 'outro',
    categoriaRotulo: categoriaAtual ? categoriaAtual.rotulo : 'Outro',
    categoriaIcone: categoriaAtual ? categoriaAtual.icone : '•',
    valor: valorCentavos,
    obs: document.getElementById('obsLancamento').value.trim(),
    data: new Date().toISOString()
  });
  salvar(lista);
  atualizarSaldo();
  pararVoz();
  fecharTela('telaLancamento');
  mostrarToast('Lançamento salvo ✓');
}

/* ---------- Voz (opcional, com verificação de suporte) ---------- */
function configurarVoz(){
  const Reconhecedor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Reconhecedor){
    document.getElementById('btnMic').style.display = 'none';
    return;
  }
  reconhecimento = new Reconhecedor();
  reconhecimento.lang = 'pt-BR';
  reconhecimento.interimResults = false;
  reconhecimento.maxAlternatives = 1;

  reconhecimento.onresult = (evento) => {
    const transcricao = evento.results[0][0].transcript;
    document.getElementById('obsLancamento').value = transcricao;
    const numeros = transcricao.match(/\d+([.,]\d+)?/);
    if(numeros && valorCentavos === 0){
      const valor = parseFloat(numeros[0].replace(',', '.'));
      if(!isNaN(valor)){
        valorCentavos = Math.round(valor * 100);
        document.getElementById('valorNumero').textContent = formatarMoeda(valorCentavos);
        validarSalvar();
      }
    }
  };
  reconhecimento.onend = pararVoz;
  reconhecimento.onerror = pararVoz;
}
function alternarMicrofone(){
  if(!reconhecimento) return;
  if(gravandoVoz){ pararVoz(); return; }
  try{
    reconhecimento.start();
    gravandoVoz = true;
    document.getElementById('btnMic').classList.add('gravando');
  }catch(e){}
}
function pararVoz(){
  gravandoVoz = false;
  const btn = document.getElementById('btnMic');
  if(btn) btn.classList.remove('gravando');
}

/* ---------- Histórico ---------- */
function filtroData(periodo){
  const agora = new Date();
  if(periodo === 'tudo') return () => true;
  const dias = periodo === '7' ? 7 : 30;
  const limite = new Date(agora.getTime() - dias*24*60*60*1000);
  return (dataISO) => new Date(dataISO) >= limite;
}

function abrirHistorico(){
  filtrarHistorico('7', document.querySelector('#telaHistorico .filtro-periodo button'));
  abrirTela('telaHistorico');
}

function filtrarHistorico(periodo, botao){
  document.querySelectorAll('#telaHistorico .filtro-periodo button').forEach(b=>b.classList.remove('ativo'));
  if(botao) botao.classList.add('ativo');

  const passa = filtroData(periodo);
  const lista = carregar().filter(l => passa(l.data)).sort((a,b)=> new Date(b.data)-new Date(a.data));

  let totalEntrada = 0, totalSaida = 0;
  lista.forEach(l => l.tipo === 'entrada' ? totalEntrada += l.valor : totalSaida += l.valor);
  document.getElementById('miniEntrou').textContent = formatarMoeda(totalEntrada);
  document.getElementById('miniSaiu').textContent = formatarMoeda(totalSaida);

  const container = document.getElementById('listaHistorico');
  container.innerHTML = '';

  if(lista.length === 0){
    container.innerHTML = '<div class="vazio"><div class="icone">🌱</div>Nenhum lançamento neste período</div>';
    return;
  }

  const grupos = {};
  lista.forEach(l => {
    const chave = new Date(l.data).toLocaleDateString('pt-BR', {day:'2-digit', month:'long'});
    (grupos[chave] = grupos[chave] || []).push(l);
  });

  Object.keys(grupos).forEach(chave => {
    const grupoDiv = document.createElement('div');
    grupoDiv.className = 'dia-grupo';
    grupoDiv.innerHTML = `<div class="dia-titulo">${chave}</div>`;
    grupos[chave].forEach(l => {
      const item = document.createElement('div');
      item.className = 'item';
      const sinal = l.tipo === 'entrada' ? '+' : '-';
      const classeVal = l.tipo === 'entrada' ? 'pos' : 'neg';
      item.innerHTML = `
        <div class="icone">${l.categoriaIcone}</div>
        <div class="info">
          <div class="cat">${l.categoriaRotulo}</div>
          ${l.obs ? `<div class="obs">${escaparHtml(l.obs)}</div>` : ''}
        </div>
        <div class="val ${classeVal}">${sinal} ${formatarMoeda(l.valor)}</div>
        <button class="excluir" aria-label="Excluir">🗑️</button>
      `;
      item.querySelector('.excluir').onclick = () => excluirLancamento(l.id, periodo, botao);
      grupoDiv.appendChild(item);
    });
    container.appendChild(grupoDiv);
  });
}

function excluirLancamento(id, periodo, botao){
  if(!confirm('Excluir este lançamento?')) return;
  const lista = carregar().filter(l => l.id !== id);
  salvar(lista);
  atualizarSaldo();
  filtrarHistorico(periodo, botao);
}

function escaparHtml(texto){
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

/* ---------- Resumo / WhatsApp ---------- */
function abrirResumo(){
  montarResumo('7', document.querySelector('#telaResumo .filtro-periodo button'));
  abrirTela('telaResumo');
}

function montarResumo(periodo, botao){
  document.querySelectorAll('#telaResumo .filtro-periodo button').forEach(b=>b.classList.remove('ativo'));
  if(botao) botao.classList.add('ativo');

  const passa = filtroData(periodo);
  const lista = carregar().filter(l => passa(l.data)).sort((a,b)=> new Date(a.data)-new Date(b.data));
  const nomeProp = document.getElementById('nomePropriedade').value || 'Propriedade';
  const rotuloPeriodo = periodo === '7' ? 'últimos 7 dias' : periodo === '30' ? 'este mês' : 'todo o período';

  let totalEntrada = 0, totalSaida = 0;
  const porCategoria = {};
  lista.forEach(l => {
    if(l.tipo === 'entrada') totalEntrada += l.valor; else totalSaida += l.valor;
    const chave = (l.tipo === 'entrada' ? '+ ' : '- ') + l.categoriaRotulo;
    porCategoria[chave] = (porCategoria[chave] || 0) + l.valor;
  });

  let texto = `*${nomeProp}*\nResumo financeiro — ${rotuloPeriodo}\n\n`;
  texto += `Entrou: ${formatarMoeda(totalEntrada)}\nSaiu: ${formatarMoeda(totalSaida)}\nSaldo do período: ${formatarMoeda(totalEntrada-totalSaida)}\n`;

  if(Object.keys(porCategoria).length){
    texto += `\nPor categoria:\n`;
    Object.keys(porCategoria).forEach(cat => {
      texto += `${cat}: ${formatarMoeda(porCategoria[cat])}\n`;
    });
  } else {
    texto += `\nNenhum lançamento neste período.\n`;
  }

  texto += `\nEnviado pelo app Meu Dinheiro na Roça`;
  document.getElementById('textoResumo').textContent = texto;
}

function enviarWhatsapp(){
  const texto = document.getElementById('textoResumo').textContent;
  const url = 'https://wa.me/?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
}

/* ---------- Navegação de telas ---------- */
function abrirTela(id){ document.getElementById(id).classList.add('ativa'); }
function fecharTela(id){ document.getElementById(id).classList.remove('ativa'); }

function mostrarToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('mostrar');
  setTimeout(()=>toast.classList.remove('mostrar'), 1800);
}
</script>
